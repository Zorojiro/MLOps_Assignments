name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # For manual trigger

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  KUBECONFIG_FILE: ${{ secrets.KUBECONFIG }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/bank-marketing-app:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/bank-marketing-app:latest
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/bank-marketing-app:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/bank-marketing-app:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Create kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
      - name: Update deployment image
        run: |
          # Replace placeholder values in yaml files
          sed -i "s|\${DOCKER_REGISTRY}|${{ env.DOCKER_REGISTRY }}|g" kubernetes/deployment.yaml
          sed -i "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" kubernetes/deployment.yaml
          sed -i "s|\${DOCKER_REGISTRY}|${{ env.DOCKER_REGISTRY }}|g" kubernetes/model-init-job.yaml
          sed -i "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" kubernetes/model-init-job.yaml
          
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/bank-marketing-app
          
      - name: Setup storage for model
        run: |
          # Apply PV, PVC for model storage and initialize with model
          kubectl apply -f kubernetes/model-storage.yaml
          kubectl apply -f kubernetes/model-init-job.yaml
          # Wait for model initialization to complete
          kubectl wait --for=condition=complete job/model-init-job --timeout=180s

      - name: Install KServe
        run: |
          # Install KServe using the current release URL
          kubectl apply -f https://github.com/kserve/kserve/releases/download/v0.11.0/kserve.yaml
          # Wait for KServe controller to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/kserve-controller-manager -n kserve

      - name: Deploy model with KServe
        run: |
          kubectl apply -f kserve/inferenceservice.yaml
          # Verify KServe deployment
          kubectl get inferenceservices.serving.kserve.io
          
      - name: Notify on completion
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}